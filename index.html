<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Роудмап DevOps и ИБ</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1f6feb;--ok:#2da44e;--bd:#e2e2de;--emp:#e8e8e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#ecece8;--mu:#9a9a94;--ac:#58a6ff;--ok:#3fb950;--bd:#33332f;--emp:#2e2e2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#ecece8;--mu:#9a9a94;--ac:#58a6ff;--ok:#3fb950;--bd:#33332f;--emp:#2e2e2b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.bar{height:10px;background:var(--emp);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat{font-size:13px;color:var(--mu)}.stat b{color:var(--tx);font-size:18px}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:4px 10px;font-size:12px}
button.done{background:var(--ok)}
.heat{display:flex;gap:3px;margin-top:10px;flex-wrap:wrap}.heat span{width:16px;height:16px;border-radius:4px;background:var(--emp)}.heat .on{background:var(--ok)}
details{margin-bottom:10px}summary{cursor:pointer;font-weight:600;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;display:flex;justify-content:space-between;gap:8px}
summary span{color:var(--mu);font-weight:400;font-size:13px;white-space:nowrap}
.sp{margin:8px 0 0 4px;padding:10px 12px;border-left:3px solid var(--bd)}.sp.full{border-color:var(--ok)}
.sp h3{margin:0 0 4px;font-size:15px}.sp h3 small{color:var(--mu);font-weight:400}
.note{font-size:13px;color:var(--ac);margin:2px 0 4px}
label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
input{margin-top:4px;width:17px;height:17px;accent-color:var(--ok);flex:none}
label.c span{text-decoration:line-through;color:var(--mu)}
.tip{font-size:13px;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>Роудмап: DevOps и ИБ</h1>
<p class="sub">52 недели · 26 спринтов по 2 недели · по 3 часа в день</p>
<div class="card">
<div class="row"><div class="stat">Общий прогресс<br><b id="pt">0%</b></div><div class="stat">Серия дней<br><b id="st">0</b></div><div class="stat">Всего занятий<br><b id="dt">0</b></div><button id="td">Сегодня позанимался</button></div>
<div class="bar" style="margin-top:12px"><i id="pb" style="width:0"></i></div>
<div class="heat" id="ht" title="Последние 28 дней"></div>
</div>
<div id="app"></div>
<p class="tip">Правило дня: ~1 час теории и ~2 часа практики. Go: 2–3 часа в неделю в фоне, основной упор на него с 21-го спринта. Синхронизация между устройствами: <span id="sy">подключаюсь…</span> <button class="g" id="rs">Сбросить всё</button></p>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const P=[
["Фаза 1 · Linux и сети",[
["Терминал",["Ubuntu в VM или WSL","ls, cd, cp, mv, grep, find, pipes","Права и пользователи","Пройти Linux Journey"]],
["Сервер",["Арендовать VPS, ssh по ключам","systemd, journalctl, cron","apt, процессы, ufw"]],
["Сети I",["OSI и TCP/IP","IP, маски, подсети","DNS, DHCP, NAT","ping, traceroute, dig, curl"]],
["Сети II",["Wireshark и tcpdump","HTTP/HTTPS и TLS","nginx на VPS + Let’s Encrypt","iptables/nftables: основы"]]]],
["Фаза 2 · Скрипты и Git",[
["Bash",["Переменные, циклы, условия","3 скрипта: бэкап, диск, логи","sed, awk"]],
["Git и Python",["Ветки, PR, rebase, GitHub-профиль","Python: файлы, requests, argparse","Скрипт для разбора логов или API"]]]],
["Фаза 3 · Windows и эксплуатация",[
["Windows Server",["AD DS: пользователи и группы","GPO","DNS/DHCP на Windows","PowerShell: основы"]],
["Эксплуатация","Мониторинг Zabbix|Бэкапы и RAID|ITIL и тикет-системы|Резюме v1".split("|"),"Начинай откликаться на L2 / сисадмин / SOC L1"]]],
["Фаза 4 · Docker и CI/CD",[
["Docker I",["Образы и контейнеры","Dockerfile, multi-stage","Volumes и сети"]],
["Docker II",["docker-compose","Приложение + БД + nginx","Registry и теги"]],
["CI/CD I",["GitHub Actions или GitLab CI","Тесты и сборка в пайплайне","Секреты"]],
["CI/CD II",["Автодеплой на VPS","Проект №1 с пайплайном","README и схема"]]]],
["Фаза 5 · Облака и IaC",[
["Облако",["IAM, VPC, виртуалки","Yandex Cloud или AWS free tier","Объектное хранилище"]],
["Terraform I",["Провайдеры, ресурсы","Variables, state"]],
["Terraform II",["Модули","VPS + сеть кодом"]],
["Ansible",["Inventory, playbooks, roles","Проект №2: Terraform + Ansible"],"Откликайся на DevOps-стажировки и инфраструктурные роли"]]],
["Фаза 6 · Kubernetes и мониторинг",[
["K8s I",["Pod, Deployment, Service","minikube или kind"]],
["K8s II",["Ingress, ConfigMap, Secret","Volumes","Helm"]],
["K8s III",["Деплой проекта №1 в кластер","Probes и HPA"]],
["Мониторинг",["Prometheus + Grafana","Алерты","Loki для логов"]],
["Проект №3",["Полный стек: IaC + K8s + мониторинг","Go: свой exporter или CLI"]]]],
["Фаза 7 · Безопасность",[
["Основы ИБ",["OWASP Top 10","Криптография, хэши, TLS","TryHackMe Pre-Security"]],
["SOC",["TryHackMe SOC Level 1","Wazuh или ELK как мини-SIEM","MITRE ATT&CK"]],
["DevSecOps",["Trivy, gitleaks, Semgrep в пайплайне","Vault","Hardening Linux"]],
["Практика",["10 машин или комнат HTB/CTF","K8s: RBAC и network policies","Написать writeup"]]]],
["Фаза 8 · Финиш",[
["Портфолио и поиск",["README и схемы архитектуры","Резюме на hh и LinkedIn","Пробные собеседования","Подача на DevOps-стажировки"]]]]
];
let S={d:{},days:[]},tm=null,pending=false;
const tg=window.Telegram&&window.Telegram.WebApp,cs=tg&&tg.initData&&tg.CloudStorage;
try{S=JSON.parse(localStorage.getItem("devops_roadmap"))||S}catch(e){}
const setSync=t=>{const e=document.getElementById("sy");if(e)e.textContent=t};
const csSet=(k,v)=>new Promise((a,b)=>cs.setItem(k,v,(e,o)=>e?b(e):a(o)));
const csGet=k=>new Promise((a,b)=>cs.getItems(k,(e,v)=>e?b(e):a(v)));
async function push(){const s=JSON.stringify(S),n=Math.ceil(s.length/3500)||1;for(let i=0;i<n;i++)await csSet("p"+i,s.slice(i*3500,(i+1)*3500));await csSet("n",String(n))}
const save=()=>{try{localStorage.setItem("devops_roadmap",JSON.stringify(S))}catch(e){}
if(!cs)return;pending=true;setSync("сохраняю…");clearTimeout(tm);tm=setTimeout(()=>push().then(()=>{pending=false;setSync("синхронизировано ✓")}).catch(()=>{pending=false;setSync("не удалось синхронизировать")}),400)};
async function pull(){if(!cs||pending)return;try{const n=+((await csGet(["n"])).n||0);
if(!n){if(S.days.length||Object.keys(S.d).length)await push();setSync("синхронизировано ✓");return}
const ks=[...Array(n).keys()].map(i=>"p"+i),v=await csGet(ks);S=JSON.parse(ks.map(k=>v[k]).join(""));S.d=S.d||{};S.days=S.days||[];
try{localStorage.setItem("devops_roadmap",JSON.stringify(S))}catch(e){}render();setSync("синхронизировано ✓")}catch(e){setSync("нет связи, прогресс хранится на устройстве")}}
function initSync(){if(!cs){setSync("хранится на этом устройстве (открой через Telegram, чтобы синхронизировать)");return}
tg.ready();tg.expand();pull();document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()})}
const iso=d=>d.toISOString().slice(0,10);
const $=id=>document.getElementById(id);
function streak(){let n=0,d=new Date();if(!S.days.includes(iso(d)))d.setDate(d.getDate()-1);
while(S.days.includes(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function render(){
let all=0,dn=0,k=0,cur=-1,h="";
P.forEach((ph,pi)=>{let pa=0,pd=0,body="";
ph[1].forEach(sp=>{k++;const ts=sp[1];let sd=0;
const items=ts.map((t,i)=>{const id=k+"-"+i,c=S.d[id];if(c)sd++;return `<label class="${c?"c":""}"><input type="checkbox" data-id="${id}" ${c?"checked":""}><span>${t}</span></label>`}).join("");
pa+=ts.length;pd+=sd;
body+=`<div class="sp ${sd==ts.length?"full":""}"><h3>Спринт ${k}: ${sp[0]} <small>${sd}/${ts.length}</small></h3>${sp[2]?`<div class="note">★ ${sp[2]}</div>`:""}${items}</div>`});
if(cur<0&&pd<pa)cur=pi;all+=pa;dn+=pd;
h+=`<details ${cur===pi?"open":""}><summary>${ph[0]}<span>${pd}/${pa}</span></summary>${body}</details>`});
$("app").innerHTML=h;
const pc=Math.round(dn/all*100);
$("pt").textContent=pc+"%";$("pb").style.width=pc+"%";
$("st").textContent=streak();$("dt").textContent=S.days.length;
const t=iso(new Date()),on=S.days.includes(t);
$("td").textContent=on?"Сегодня засчитано ✓":"Сегодня позанимался";$("td").className=on?"done":"";
let hh="";for(let i=27;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);hh+=`<span class="${S.days.includes(iso(d))?"on":""}" title="${iso(d)}"></span>`}
$("ht").innerHTML=hh}
$("app").addEventListener("change",e=>{const id=e.target.dataset.id;if(!id)return;
const open=[...document.querySelectorAll("details")].map(x=>x.open);
if(e.target.checked)S.d[id]=1;else delete S.d[id];save();render();
document.querySelectorAll("details").forEach((x,i)=>x.open=open[i])});
$("td").onclick=()=>{const t=iso(new Date()),i=S.days.indexOf(t);if(i<0)S.days.push(t);else S.days.splice(i,1);save();render()};
let armed=0;$("rs").onclick=function(){if(!armed){armed=1;this.textContent="Нажми ещё раз для сброса";setTimeout(()=>{armed=0;this.textContent="Сбросить всё"},3000);return}
S={d:{},days:[]};save();armed=0;this.textContent="Сбросить всё";render()};
render();
initSync();
</script>
</body>
</html>
